<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دروس من صلح الحديبية</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f6b4f">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--text:#1f2a24;--muted:#5d6b63;--accent:#1f6b4f;--accent-text:#fff;--soft:#e6f1ea;--border:#d9d3c4;--note:#fff7e0;--note-border:#e3c766;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--text:#e8efe9;--muted:#9fb0a5;--accent:#4fb58c;--accent-text:#0d1612;--soft:#223229;--border:#33423a;--note:#2b2714;--note-border:#7a6a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--text:#e8efe9;--muted:#9fb0a5;--accent:#4fb58c;--accent-text:#0d1612;--soft:#223229;--border:#33423a;--note:#2b2714;--note-border:#7a6a2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal",Tahoma,"Segoe UI",sans-serif;line-height:1.85;font-size:17px}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px}
header{position:relative;overflow:hidden;text-align:center;margin-bottom:22px;padding:26px 16px 108px;border-radius:20px;color:#fff;background:linear-gradient(160deg,#1f6b4f 0%,#2c8a8f 60%,#d9a441 100%)}
.logo{font-size:2.4rem;letter-spacing:6px}
h1{font-size:1.75rem;font-weight:800;margin:4px 0 6px;color:#fff}
.sub{color:#fff;opacity:.92;margin:0;font-size:1rem}
.dunes{position:absolute;left:0;right:0;bottom:0;width:100%;height:110px;display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:700;margin-bottom:8px}
textarea{width:100%;box-sizing:border-box;min-height:130px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font:inherit;font-size:.92rem;cursor:pointer;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--text);border-radius:999px;padding:4px 14px;font-weight:700}
.chip:active{transform:scale(.96)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#go{flex:1;min-width:160px;font:inherit;font-size:1.05rem;cursor:pointer;border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(135deg,#1f6b4f,#2c8a8f);color:#fff;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.18)}
#go:disabled{opacity:.5;cursor:default}
#clear{font:inherit;cursor:pointer;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:12px;padding:12px 18px}
.meta{color:var(--muted);font-size:.88rem;margin-top:10px;text-align:center}
.sec{display:flex;gap:12px;align-items:flex-start;border-right:5px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));border-radius:12px;padding:10px 14px;margin:0 0 14px}
.sec h2{font-size:1.05rem;color:var(--c);margin:0 0 2px;font-weight:800}
.ill{flex:0 0 56px;width:56px;height:56px;color:var(--c);border-radius:14px;background:color-mix(in srgb,var(--c) 20%,var(--card));padding:4px;box-sizing:border-box}
.ill svg{width:100%;height:100%;display:block}
.sec-body{flex:1;min-width:0}
.sec p,.sec ol{margin:0}
.sec ol{padding-right:20px}
.note{background:var(--note);border:1px solid var(--note-border);border-radius:12px;padding:10px 12px;font-size:.9rem}
.err{color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
<header>
<div class="logo" aria-hidden="true">📜</div>
<h1>دروس من صلح الحديبية</h1>
<p class="sub">احكِ لنا موقفك، وسنريك ما يشبهه في قصة الصلح وكيف نتصرف.</p>
<svg class="dunes" viewBox="0 0 640 110" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs><radialGradient id="sg"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></radialGradient><g id="cm" fill="#0f3d2e" stroke="#0f3d2e" stroke-linecap="round"><ellipse cx="15" cy="10" rx="9" ry="4.5" stroke="none"/><circle cx="14" cy="6" r="3" stroke="none"/><path d="M23 9 C27 6 27 3 29 2" fill="none" stroke-width="3"/><ellipse cx="30.5" cy="2" rx="3" ry="1.6" stroke="none"/><path d="M9 12 V21 M12.5 12 V21 M18.5 12 V21 M22 12 V21" fill="none" stroke-width="1.6"/></g></defs><circle cx="470" cy="38" r="44" fill="url(#sg)"/><circle cx="470" cy="38" r="20" fill="#ffe9a8"/><path d="M0 70 C100 40 200 40 300 66 C400 92 500 80 640 50 L640 110 L0 110 Z" fill="#fff" fill-opacity=".22"/><use href="#cm" transform="translate(236 50) scale(.8)" opacity=".75"/><use href="#cm" transform="translate(274 54) scale(.8)" opacity=".75"/><use href="#cm" transform="translate(312 58) scale(.8)" opacity=".75"/><g fill="none" stroke-linecap="round" stroke="#14503a" stroke-width="3"><path d="M92 100 C94 82 90 72 94 58"/><path d="M94 58 C80 50 70 54 64 62"/><path d="M94 58 C86 44 74 42 66 46"/><path d="M94 58 C108 48 120 52 126 60"/><path d="M94 58 C102 44 114 42 122 46"/><path d="M94 58 C94 46 94 40 94 34"/></g><path d="M0 90 C120 68 230 70 340 88 C450 106 540 98 640 82 L640 110 L0 110 Z" fill="#fff" fill-opacity=".4"/></svg>
</header>

<div class="card">
<label for="sit">ما الموقف الذي تمرّ به؟</label>
<textarea id="sit" maxlength="1000" placeholder="مثال: اتفقتُ مع زميلي على مشروع، لكنه رفض فكرتي وأصرّ على شروطه، فتضايقتُ كثيرًا…"></textarea>
<div class="chips" id="chips">
<button class="chip" type="button" data-k="خلاف مع صديق" style="--c:#3b82c4">🤝 خلاف مع صديق</button>
<button class="chip" type="button" data-k="شروط أراها غير عادلة" style="--c:#c9962b">⚖️ شروط أراها غير عادلة</button>
<button class="chip" type="button" data-k="صبر على أمر أريده" style="--c:#2e9b6f">⏳ صبر على أمر أريده</button>
<button class="chip" type="button" data-k="قرار صعب" style="--c:#d4604f">🧭 قرار صعب</button>
</div>
<div class="actions">
<button id="go">اعرض الدرس والحل</button>
<button id="clear" type="button">مسح</button>
</div>
<div class="meta" id="left"></div>
</div>

<div class="card" id="out" hidden>
<div id="result"></div>
<div class="note">نموذج تجريبي: تأكّد من التفاصيل التاريخية في كتابك المدرسي أو من معلّمك.</div>
</div>
</main>

<script>
(function(){
var $ = function(id){return document.getElementById(id)};
var STARTERS = {
"خلاف مع صديق":"حدث خلاف بيني وبين صديقي، ولا أعرف كيف أصلح الأمر دون أن أشعر أنني خسرت…",
"شروط أراها غير عادلة":"طُلب مني أن أقبل شروطًا أراها ظالمة، لكنني لا أستطيع الرفض…",
"صبر على أمر أريده":"أريد شيئًا بشدة لكن عليّ أن أنتظر، وأشعر بالضيق من التأخير…",
"قرار صعب":"أمامي قرار صعب، وكل خيار فيه شيء أحبه وشيء أخسره…"
};



$("chips").addEventListener("click", function(e){
  var t = e.target.closest(".chip"); if(!t) return;
  $("sit").value = STARTERS[t.dataset.k] || ""; $("sit").focus();
});
$("clear").addEventListener("click", function(){ $("sit").value = ""; $("out").hidden = true; });

var ICONS = {
"🙋":'<svg viewBox="0 0 64 64"><path d="M32 12 V56" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M32 14 H50 L56 20 L50 26 H32 Z" fill="currentColor"/><path d="M32 30 H14 L8 36 L14 42 H32 Z" fill="currentColor" opacity=".6"/><path d="M14 58 H50" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".4"/></svg>',
"📜":'<svg viewBox="0 0 64 64"><rect x="14" y="10" width="36" height="44" rx="6" fill="currentColor" opacity=".25"/><rect x="14" y="10" width="36" height="8" rx="4" fill="currentColor"/><rect x="14" y="46" width="36" height="8" rx="4" fill="currentColor"/><path d="M22 26 H42 M22 32 H42 M22 38 H34" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="46" cy="40" r="6" fill="currentColor"/></svg>',
"🧭":'<svg viewBox="0 0 64 64"><ellipse cx="14" cy="52" rx="9" ry="4" fill="currentColor" opacity=".5"/><ellipse cx="30" cy="42" rx="9" ry="4" fill="currentColor" opacity=".75"/><ellipse cx="46" cy="32" rx="9" ry="4" fill="currentColor"/><path d="M46 30 V10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M46 10 L58 15 L46 20 Z" fill="currentColor"/></svg>',
"🌟":'<svg viewBox="0 0 64 64"><path d="M6 46 A26 26 0 0 1 58 46 Z" fill="currentColor" opacity=".3"/><circle cx="32" cy="40" r="11" fill="currentColor"/><path d="M32 12 V18 M12 22 L16 26 M52 22 L48 26 M6 40 H12 M52 40 H58" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M4 50 C18 42 30 54 42 48 C50 44 56 46 60 48 V58 H4 Z" fill="currentColor"/></svg>'
};
function sec(emoji, color, title, node){
  var d = document.createElement("div"); d.className = "sec"; d.style.setProperty("--c", color);
  var ill = document.createElement("div"); ill.className = "ill"; ill.setAttribute("aria-hidden", "true"); ill.innerHTML = ICONS[emoji] || "";
  var b = document.createElement("div"); b.className = "sec-body";
  var h = document.createElement("h2"); h.textContent = title;
  b.appendChild(h); b.appendChild(node); d.appendChild(ill); d.appendChild(b); return d;
}
function para(t){ var p = document.createElement("p"); p.textContent = t; return p; }

function render(data){
  var box = $("result"); box.textContent = "";
  box.appendChild(sec("🙋", "#3b82c4", "موقفك", para(data.summary || "")));
  box.appendChild(sec("📜", "#c9962b", "ما يشبهه في صلح الحديبية", para(data.lesson || "")));
  var ol = document.createElement("ol");
  (data.steps || []).forEach(function(s){ var li = document.createElement("li"); li.textContent = s; ol.appendChild(li); });
  box.appendChild(sec("🧭", "#2e9b6f", "ماذا تفعل؟", ol));
  box.appendChild(sec("🌟", "#e0702f", "النتيجة المتوقعة", para(data.outcome || "")));
}

$("go").addEventListener("click", async function(){
  var sit = $("sit").value.trim();
  if(!sit){ $("sit").focus(); return; }
  $("go").disabled = true; $("out").hidden = false;
  $("result").innerHTML = '<p class="err">🐪 جارٍ التفكير في موقفك…</p>';
  try{
    var res = await fetch("/api/analyze", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({situation:sit})});
    var data = await res.json();
    if(!res.ok){ throw {code:data.error || "error"}; }
    render(data.result);
    if(typeof data.remaining === "number"){ $("left").textContent = "المحاولات المتبقية اليوم: " + data.remaining; }
    $("out").scrollIntoView({behavior:"smooth", block:"start"});
  }catch(err){
    var msg = "تعذّر التحليل. حاول مرة أخرى.";
    if(err && err.code === "limit"){ msg = "انتهت محاولاتك اليوم. عُد غدًا."; $("left").textContent = "المحاولات المتبقية اليوم: 0"; }
    else if(err && err.code === "busy"){ msg = "الخدمة مزدحمة الآن. حاول لاحقًا."; }
    else if(err && err.code === "too_long"){ msg = "الموقف طويل جدًا. اختصره قليلًا."; }
    $("result").innerHTML = '<p class="err">' + msg + '</p>';
  }
  $("go").disabled = false;
});
if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); }); }
})();
</script>
</body>
</html>
